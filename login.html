<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | V-Mart Billing System</title>

    <!-- V-Mart login styles -->
    <link rel="stylesheet" href="login.css" />

    <!-- Font Awesome for icons (show/hide password, logo etc.) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>

    <!-- ===== LOGIN WRAPPER ===== -->
    <div class="login-wrapper">

        <!-- Logo / Brand -->
        <div class="login-logo">
            <span class="logo-icon">🛍️</span>
            <span class="logo-text">V-Mart</span>
        </div>

        <!-- Welcome message -->
        <h1 class="welcome-title">Welcome Back!</h1>
        <p class="welcome-subtitle">Login to access the V-Mart Retail Billing System</p>

        <!-- ===== LOGIN CARD ===== -->
        <div class="login-card">

            <!-- Error message area (hidden by default) -->
            <div id="loginError" class="login-error" style="display:none;">
                <i class="fas fa-exclamation-circle"></i>
                <span>Incorrect username or password.</span>
            </div>

            <!-- Login Form -->
            <form id="loginForm" onsubmit="handleLogin(event)" novalidate>

                <!-- Username field -->
                <div class="form-group">
                    <label for="username">Username</label>
                    <div class="input-wrapper">
                        <i class="fas fa-user"></i>
                        <input
                            type="text"
                            id="username"
                            name="username"
                            placeholder="Enter username"
                            autocomplete="username"
                        />
                    </div>
                </div>

                <!-- Password field with show/hide toggle -->
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter password"
                            autocomplete="current-password"
                        />
                        <!-- Show/Hide password button -->
                        <button
                            type="button"
                            id="togglePassword"
                            class="toggle-password"
                            onclick="togglePasswordVisibility()"
                            aria-label="Show or hide password"
                        >
                            <i class="fas fa-eye" id="toggleIcon"></i>
                        </button>
                    </div>
                </div>

                <!-- Remember me + Forgot (demo only, no forgot link) -->
                <div class="form-row">
                    <label class="remember-check">
                        <input type="checkbox" id="rememberMe" name="rememberMe" />
                        <span>Remember me</span>
                    </label>
                </div>

                <!-- Login button with loading effect -->
                <button type="submit" id="loginBtn" class="login-btn">
                    <span class="btn-text"><i class="fas fa-sign-in-alt"></i> Login</span>
                    <span class="spinner" style="display:none;"></span>
                </button>

            </form>

            <!-- Demo hint -->
            <div class="demo-hint">
                <i class="fas fa-info-circle"></i>
                Demo credentials — Username: <strong>Admin</strong> &nbsp;|&nbsp; Password: <strong>Nandini</strong>
            </div>

        </div>

        <!-- Footer -->
        <div class="login-footer">
            Professionally designed by <span>Nandini Mondal</span>
        </div>

    </div>

    <!-- Login script -->
    <script src="login.js"></script>
</body>
</html>
